<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="NUTRIMANDALAS.png">
  <title>NUTRIMANDALAS - GENERATOR</title>
  <style>
    :root{ --blue:#001aff; --row-h:52px; --pad:6px; --label-w:150px; }
@media (max-width: 480px){ :root{ --label-w:110px; } .controls label{ font-size:12px; } }
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--blue);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Footlight MT Light",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;text-align:center}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:1180px}
    .brand h1{flex:1;margin:4px 0 6px;font-size:44px;letter-spacing:.3px}
    .brand img.logo{height:64px;width:auto;object-fit:contain}
    @media (max-width: 640px){
      .brand h1{font-size:32px}
      .brand img.logo{height:48px}
    }
    .topbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
    .topbar input[type="file"]{padding:6px;background:#fff;border:2px solid var(--blue);border-radius:10px}
    button{padding:4px 8px;background:var(--blue);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:0 0 10px rgba(0,26,255,.45);font-size:12px}
    button:hover{opacity:.97;filter:brightness(1.03)}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px;align-items:start;justify-content:center;max-width:1180px;width:100%}
    @media (max-width: 1100px){ .controls{grid-template-columns:repeat(3,minmax(180px,1fr));} }
    @media (max-width: 820px){ .controls{grid-template-columns:repeat(2,minmax(180px,1fr));} }
    @media (max-width: 520px){ .controls{grid-template-columns:1fr;} }
    .controls .row{display:grid;grid-template-columns:var(--label-w) 1fr;gap:8px;align-items:center;background:#f7f9ff;border:2px solid var(--blue);border-radius:10px;padding:var(--pad);min-height:var(--row-h);box-shadow:0 0 6px rgba(0,26,255,.22)}
    .controls label{justify-self:start;font-size:13px;line-height:1.05}
    .controls .right{display:flex;gap:6px;align-items:center}
    .controls input[type="range"], .controls select{width:100%; height:22px; accent-color: var(--blue); font-size:12px}
    input[type="range"]{height:24px}
    input[type="range"]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#cfe0ff,#86a8ff);border-radius:8px}
    input[type="range"]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:-4px;box-shadow:0 0 0 2px #fff inset, 0 0 6px rgba(0,26,255,.7)}
    input[type="range"]::-moz-range-track{height:6px;background:linear-gradient(90deg,#cfe0ff,#86a8ff);border-radius:8px}
    input[type="range"]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff inset, 0 0 6px rgba(0,26,255,.7)}
    .val{font-variant-numeric:tabular-nums;border:2px solid var(--blue);border-radius:10px;padding:1px 6px;min-width:52px;text-align:center;color:var(--blue);background:#fff;font-size:11px}
    .stage{position:relative;display:inline-block;padding-right:380px}
@media (max-width: 820px){ .stage{ padding-right:0; } }
    canvas{border:2px solid var(--blue);border-radius:12px;width:100%;max-width:740px;height:auto;background:#fff;box-shadow:0 0 10px rgba(0,26,255,.18)} canvas{touch-action:none;}
    .overlay{position:absolute;z-index:5;display:none}
    .overlay.show{display:flex}
    .overlay.side{top:24%;right:8px;transform:translateY(-50%);flex-direction:column}
    .overlay.card{background:#f7f9ff;border:2px solid var(--blue);border-radius:12px;padding:10px;gap:8px;align-items:center;justify-content:center;box-shadow:0 10px 18px rgba(0,26,255,.18);width:90vw; max-width:320px;max-height:85vh;overflow:auto}
    #creditsOverlay{ font-size:12px; line-height:1.25; text-align:left }
    #creditsOverlay p{ margin:.3em 0 }
    .palette{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    .swatch{display:none} 
    .palette input[type="color"]{width:48px;height:32px;border:2px solid var(--blue);border-radius:10px;padding:0;background:#fff;cursor:pointer}
    .palette input[type="text"]{height:32px}
    #info{white-space:normal;max-width:980px;margin-top:6px}
  

body {
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  touch-action: none;
}
@media (max-width: 900px){
  .stage { padding-right: 0 !important; }
}
@media (max-width: 480px){
  button { font-size: 16px !important; padding: 10px 16px !important; }
}


#c, #customCanvas { touch-action: none; }
.touch-block { touch-action: none; }
</style>

<style>

@media (max-width: 1024px){
  body{ padding: clamp(10px, 2vw, 16px); }

  
  .brand{ flex-wrap: wrap; gap:10px; justify-content:center; text-align:center; }
  .brand h1{ order:3; width:100%; font-size: clamp(26px, 5vw, 36px); margin: 2px 0 8px; }
  .brand img.logo{ height: clamp(40px, 6vw, 56px); }

  
  .topbar{
    position: sticky; top: 0; padding: 8px 4px; background:#fff; z-index: 20;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 2px solid var(--blue); border-radius: 12px;
  }
  .topbar::-webkit-scrollbar{ display:none; }
  .topbar button{ flex: 0 0 auto; }
  #fileName{ max-width: 40vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
}

@media (max-width: 820px){
  
  .controls{ gap: 10px; }
  .controls .row{ grid-template-columns: 1fr; text-align: left; padding: 10px; }
  .controls label{ font-size: 14px; }
  .controls .right{ width:100%; gap: 10px; }
  .val{ min-width: 64px; font-size: 12px; padding: 4px 8px; }

  
  .stage{ width: 100%; padding-right: 0 !important; }
  canvas{ max-width: 100%; height: auto; }

  
  select, .controls input[type="range"]{ height: 34px; }
}

@media (max-width: 640px){
  :root{ --label-w: 100%; --row-h: 58px; --pad: 10px; }

  .topbar{ gap: 6px; }
  #fileName{ display:none; } 

  
  button{ font-size: 16px; padding: 10px 16px; border-radius: 14px; }
  .val{ font-size: 13px; }

  
  .overlay.card{
    width: 96vw; max-width: 96vw;
    left: 50% !important; right: auto !important; transform: translateX(-50%) !important;
  }
  #creditsOverlay.overlay.card{
    top: auto !important;
    bottom: calc(8px + env(safe-area-inset-bottom));
    max-height: 60vh;
  }
  #paintOverlay.overlay.side.card{
    top: auto; bottom: calc(8px + env(safe-area-inset-bottom));
    right: 50%; transform: translate(50%, 0);
    max-width: 96vw;
  }

  
  input[type="range"]{ height: 22px; }
  input[type="range"]::-webkit-slider-runnable-track{ height: 8px; }
  input[type="range"]::-webkit-slider-thumb{ width: 18px; height: 18px; margin-top: -5px; }
  input[type="range"]::-moz-range-track{ height: 8px; }
  input[type="range"]::-moz-range-thumb{ width: 18px; height: 18px; }

  
  @supports (padding:max(0px)) {
    body{
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
  }
}

@media (max-width: 400px){
  .brand h1{ font-size: clamp(20px, 6.5vw, 28px); }
  button{ font-size: 15px; padding: 10px 14px; }
}

</style>

<style>

@media (max-width: 640px){
  
  .stage{
    display: grid !important;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    gap: 12px;
    padding-right: 0 !important;
    width: 100%;
  }

  
  .stage > canvas#c{
    grid-row: 1;
    grid-column: 1;
    max-width: 100%;
    height: auto !important;
    justify-self: center;
  }

  
  #paintOverlay.overlay,
  #customOverlay.overlay{
    grid-row: 2;
    grid-column: 1;
    position: static !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;
    transform: none !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0;
  }
}

</style>

<style>

@media (max-width: 640px){
  html{ font-size: 14px; }
  body{ padding: 8px; }

  
  .brand{ gap: 6px; }
  .brand h1{ margin: 0 0 6px; font-size: clamp(20px, 5.4vw, 28px); }
  .brand img.logo{ height: clamp(34px, 5vw, 46px); }

  
  .topbar{ padding: 6px 4px; gap: 6px; }
  .topbar button{ font-size: 13px; padding: 6px 10px; min-height: 34px; border-radius: 10px; }

  
  button{ font-size: 14px; padding: 6px 10px; min-height: 34px; line-height: 1.15; border-radius: 10px; }

  
  .controls{ gap: 6px; }
  .controls .row{ padding: 6px; gap: 6px; }
  .controls label{ font-size: 12.5px; margin-bottom: 2px; }
  .controls .right{ gap: 6px; }

  
  .val{ min-width: 48px; font-size: 11.5px; padding: 2px 6px; }

  
  select, .controls input[type="text"], .controls input[type="number"], .controls input[type="color"]{
    height: 30px; font-size: 14px; padding: 3px 8px;
  }

  
  .controls input[type="range"]{ height: 22px; }
  .controls input[type="range"]::-webkit-slider-runnable-track{ height: 6px; }
  .controls input[type="range"]::-webkit-slider-thumb{ width: 14px; height: 14px; margin-top: -4px; }
  .controls input[type="range"]::-moz-range-track{ height: 6px; }
  .controls input[type="range"]::-moz-range-thumb{ width: 14px; height: 14px; }

  
  .overlay.card{ padding: 8px; border-radius: 12px; }
  #paintOverlay .row, #customOverlay .row{ padding: 6px; }


  .chip, .pill, .tag{ font-size: 12px; padding: 4px 8px; }
}

@media (max-width: 400px){
  html{ font-size: 13px; }
  .topbar button{ font-size: 12.5px; padding: 6px 8px; min-height: 32px; }
  button{ font-size: 13px; padding: 6px 8px; min-height: 32px; }
  select, .controls input[type="text"], .controls input[type="number"], .controls input[type="color"]{
    height: 28px; font-size: 13px; padding: 2px 6px;
  }
  .controls input[type="range"]{ height: 20px; }
}

</style>

<style>
/* Mobile/performance refinements: preserve layout and visual language. */
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
.topbar{ scrollbar-width:none; }
button, select, input[type="color"], input[type="range"]{ touch-action:manipulation; }
@media (hover:none){ button:hover{ opacity:1; filter:none; } }
@media (pointer:coarse) and (max-width:640px){
  .topbar button, button{ min-height:44px; }
  select, .controls input[type="text"], .controls input[type="number"], .controls input[type="color"]{ min-height:40px; }
  .controls input[type="range"]{ min-height:36px; }
}
</style>
</head>
<body>

  <div class="brand">
    <img class="logo" src="NUTRIMANDALAS.png" alt="NUTRIMANDALAS logo (left)" decoding="async">
    <h1>NUTRIMANDALAS - GENERATOR</h1>
    <img class="logo" src="ibima.png" alt="IBIMA Plataforma BIONAND logo (right)" decoding="async">
  </div>

  <div class="topbar">
    <button id="langEs" title="Español">ES</button>
    <button id="langEn" title="English">EN</button>
    <input id="file" type="file" accept="image/*" style="display:none" />
    <button id="fileBtn">📁 Select file</button><span id="fileName" style="margin-left:8px">No file chosen</span>
    <button id="paintToggle" aria-pressed="false">🔆 Color</button>
    <button id="mosaicToggle" aria-pressed="true" title="Toggle mosaic">🔥</button>
    <button id="lanternToggle" aria-pressed="false" title="Only">🏮</button>
    <button id="customBtn" aria-pressed="false" title="Custom">🍃</button>
    <button id="panToggle" aria-pressed="false" title="Moving">💃🏽</button>
    <button id="download">⬇️ Download</button>
    <button id="wave" aria-pressed="false">🌊 Credits</button>
  </div>

  <div class="controls">
    <div class="row"><label for="imgScale">Image scale</label><div class="right"><span class="val" id="imgScaleVal">100%</span><input id="imgScale" type="range" min="10" max="800" step="1" value="100"></div></div>
    <div class="row"><label for="tile">Tile size</label><div class="right"><span class="val" id="tileVal">180 px</span><input id="tile" type="range" min="40" max="800" step="10" value="180"></div></div>
    <div class="row"><label for="borderWidth">Outline width</label><div class="right"><span class="val" id="borderWidthVal">6 px</span><input id="borderWidth" type="range" min="1" max="20" step="1" value="6"></div></div>
    <div class="row"><label for="stroke">Stroke width</label><div class="right"><span class="val" id="strokeVal">1.8</span><input id="stroke" type="range" min="0.5" max="5" step="0.1" value="1.8"></div></div>

    <div class="row"><label for="dilate">Edge closing</label><div class="right"><span class="val" id="dilateVal">6 px</span><input id="dilate" type="range" min="0" max="20" step="1" value="6"></div></div>
    <div class="row"><label for="blur">Pre-smoothing</label><div class="right"><span class="val" id="blurVal">2 px</span><input id="blur" type="range" min="0" max="8" step="1" value="2"></div></div>
    <div class="row"><label for="edgeThr">Edge sensitivity</label><div class="right"><span class="val" id="edgeThrVal">35</span><input id="edgeThr" type="range" min="10" max="120" step="1" value="35"></div></div>
    <div class="row"><label for="thrFixed">Fixed threshold</label><div class="right"><span class="val" id="thrFixedVal">200</span><input id="thrFixed" type="range" min="0" max="255" step="1" value="200"></div></div>

    <div class="row"><label for="rings">Rings</label><div class="right"><span class="val" id="ringsVal">10</span><input id="rings" type="range" min="2" max="32" step="1" value="10"></div></div>
    <div class="row"><label for="spokes">Spokes</label><div class="right"><span class="val" id="spokesVal">20</span><input id="spokes" type="range" min="4" max="64" step="1" value="20"></div></div>
    <div class="row"><label for="style">Motif shape</label><div class="right"><select id="style">
      <option value="ellipse" selected>Ellipses (petals)</option>
      <option value="star">Star</option>
      <option value="tri">Triangles</option>
      <option value="hex">Hexagons</option>
      <option value="square">Squares/diamonds</option>
      <option value="flower">Flower</option>
      <option value="spiral">Spiral</option>
      <option value="wave">Waves</option>
      <option value="grid">Grid</option>
      <option value="none">Lines & rings only</option>
    </select></div></div>

    <div class="row"><label for="method">Mask method</label><div class="right"><select id="method">
      <option value="auto" selected>Automatic (Otsu if needed)</option>
      <option value="edges">Edges only</option>
      <option value="fixed">Fixed threshold</option>
    </select></div></div>
    <div class="row"><label for="invertSel" id="invertLabel">Mask</label><div class="right"><select id="invertSel"><option value="inside">Keep inside</option><option value="outside">Keep outside</option></select></div></div>

    <div class="row"><label for="exportScale">Export size</label><div class="right"><select id="exportScale">
      <option value="1">1× (1200×1200)</option>
      <option value="2">2× (2400×2400)</option>
      <option value="3">3× (3600×3600)</option>
      <option value="4">4× (4800×4800)</option>
    </select></div></div>
    <div class="row"><label for="format">Format</label><div class="right"><select id="format">
      <option value="png" selected>PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="tiff">TIFF</option>
      <option value="pdf">PDF</option>
    </select></div></div>
    <div class="row"><label for="bgMode" id="bgLabel">Background</label><div class="right"><select id="bgMode"><option value="transparent" selected>Transparent</option><option value="white">White</option><option value="inverted">Inverted</option></select></div></div>
  </div>

  <div class="stage" id="stage">
    <div id="paintOverlay" class="overlay side card">
      <div class="palette" id="palette">
  <label for="colorPicker" style="font-size:12px">Color</label>
  <input type="color" id="colorPicker" value="#ff9900" title="Color">
  <input type="text" id="colorHex" value="#ff9900" title="#HEX"          pattern="^#?[0-9a-fA-F]{6}$" style="width:94px;border:2px solid var(--blue);border-radius:10px;padding:2px 6px;background:#fff;color:var(--blue);">
</div>
<button id="bucketTool" aria-pressed="true">🪣 Fill</button> 
      <button id="brushTool" aria-pressed="false">🖌️ Brush</button>
      <button id="eraser" aria-pressed="false">🧽 Erase</button>
      <div class="row" style="margin-top:8px;display:flex;gap:8px;align-items:center;justify-content:center">
        <label for="brushSize" id="brushSizeLabel">Brush size</label>
        <input id="brushSize" type="range" min="1" max="80" value="20" style="width:120px">
        <span id="brushSizeVal">20 px</span>
      </div>
      <button id="clearPaint">🗑️ Clear</button>
    </div>

    <canvas id="c" width="1200" height="1200" aria-label="Canvas"></canvas>

    <div id="creditsOverlay" class="overlay side card" style="top:16px; right:8px; transform:none;"></div>

    
<div id="customOverlay" class="overlay card" style="left:84%;top:40%;transform:translate(-50%,-50%);">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;">
    
     <div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;">
      
      
      <label for="customColor" style="font-size:18px">🎨</label>
      <input type="color" id="customColor" value="#000000">

      <label for="customBg" style="font-size:18px">🌅</label>
      <input type="color" id="customBg" value="#ffffff">

	<label for="customMirror" style="font-size:18px;display:flex;gap:6px;align-items:center;">❄
        <input id="customMirror" type="checkbox">
      </label>
        
    </div>

    
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;">
    
      <div style="display:flex;align-items:center;gap:6px;">
        <label for="customBrush" style="font-size:18px">🌐</label>
        <input id="customBrush" type="range" min="1" max="60" value="12" style="width:140px">
        <span id="customBrushVal">12 px</span>
        
      </div>
	
       
      <div style="display:flex;align-items:center;gap:6px;margin-top:-4px;">
        <input id="customReps" type="range" min="1" max="48" value="12" step="1" style="width:160px">
        <span id="customRepsVal">12</span>
	<label for="customReps" style="font-size:18px;margin-left:6px;">🎶</label>
      </div>
    </div>
        <canvas id="customCanvas" width="512" height="512" style="border:2px solid var(--blue);border-radius:12px;background:#fff;touch-action:none"></canvas>
        <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button id="customClear">🗑️</button>
          <button id="customUse">✔️</button>
          <button id="customClose">✖️</button>
        </div>
        <small style="opacity:.8;max-width:340px;text-align:center"> </small>
      </div>
    </div>

  </div>

  <div id="info"></div>

  <script>
  (function(){
    const $=id=>document.getElementById(id);
    const fileInput=$('file');
    const fileBtn=$('fileBtn');
    const fileName=$('fileName');
    const canvas=$('c');
    const ctx=canvas.getContext('2d');
    const downloadBtn=$('download');
    const waveBtn=$('wave');
    const paintToggle=$('paintToggle');
    const mosaicToggle=$('mosaicToggle');
    const panToggle=$('panToggle');
    const paintOverlay=$('paintOverlay');
    const creditsOverlay=$('creditsOverlay');
    const palette=$('palette');
    const bucketBtn=$('bucketTool');
    const brushBtn=$('brushTool');
    const brushSizeEl=$('brushSize');
    const brushSizeVal=$('brushSizeVal');
    const brushSizeLabel=$('brushSizeLabel');
    const eraserBtn=$('eraser');
    const clearPaintBtn=$('clearPaint');
    const infoDiv=$('info');
    const bgMode=$('bgMode');

    const blurEl=$('blur'), blurVal=$('blurVal');
    const edgeThrEl=$('edgeThr'), edgeThrVal=$('edgeThrVal');
    const dilateEl=$('dilate'), dilateVal=$('dilateVal');
    const borderWidthEl=$('borderWidth'), borderWidthVal=$('borderWidthVal');
    const methodEl=$('method');
    const thrFixedEl=$('thrFixed'), thrFixedVal=$('thrFixedVal');
    const invertSel=$('invertSel');
    const imgScaleEl=$('imgScale'), imgScaleVal=$('imgScaleVal');
    const exportScaleEl=$('exportScale');
    const formatEl=$('format');
    const tileEl=$('tile'), tileVal=$('tileVal');
    const strokeEl=$('stroke'), strokeVal=$('strokeVal');
    const spokesEl=$('spokes'), spokesVal=$('spokesVal');
    const ringsEl=$('rings'), ringsVal=$('ringsVal');
    const styleEl=$('style');

    
    let currentLang = 'en';
    const I18N = {
      en: {
        sel:'📁 Select file', none:'No file chosen', paint:'🔆 Color', dl:'⬇️ Download', cred:'🌊 Credits',
        bg:'Background', bgTransparent:'Transparent', bgWhite:'White', bgInverted:'Inverted',
        brush:'🖌️ Brush', brushSize:'Brush size', clear:'🗑️ Clear', fill:'🪣 Fill', erase:'🧽 Erase',
        imgScale:'Image scale', tile:'Tile size', outline:'Outline width', stroke:'Stroke width', close:'Edge closing', smooth:'Pre-smoothing', edge:'Edge sensitivity', thr:'Fixed threshold',
        rings:'Rings', spokes:'Spokes', motif:'Motif shape', maskMethod:'Mask method', invert:'Mask', exp:'Export size', fmt:'Format',
        auto:'Automatic (Otsu if needed)', edges:'Edges only', fixed:'Fixed threshold',
        shapes:['Ellipses (petals)','Star','Triangles','Hexagons','Squares/diamonds','Flower','Spiral','Waves','Grid','Lines & rings only'],
        invKeepIn:'Keep inside', invKeepOut:'Keep outside',
        mosaicTitleOn:'Toggle mosaic (on)', mosaicTitleOff:'Toggle mosaic (off)',
        panOn:'Moving (hand)', panOff:'Static',
        alertLoad:'Load an image and generate the mandala first.',

    function lanternPlacementVisible(ox,oy){
      if(!lanternOn) return true;
      const W=canvas.width,H=canvas.height;
      const tileSize=Math.max(1,parseInt(tileEl.value,10)||180);
      const left=W/2-tileSize/2+ox, top=H/2-tileSize/2+oy;
      const right=left+tileSize, bottom=top+tileSize;
      const ix0=Math.max(0,left), iy0=Math.max(0,top), ix1=Math.min(W,right), iy1=Math.min(H,bottom);
      if(ix1<=ix0 || iy1<=iy0) return false;

      // Keep a useful portion visible even when there is no image mask.
      if(!imgEl || !lastMask){
        return ((ix1-ix0)*(iy1-iy0)) >= tileSize*tileSize*0.12;
      }

      // If there is a mask, reject a drag position that would clip the
      // single motif almost completely. The visible side follows Mask mode.
      const a=getLanternMaskAlpha();
      if(!a) return true;
      const mw=lastMask.width,mh=lastMask.height;
      const samples=12; let allowed=0,total=0;
      for(let sy=0;sy<samples;sy++){
        const y=Math.max(0,Math.min(mh-1,Math.floor(iy0+(iy1-iy0)*(sy+0.5)/samples)));
        for(let sx=0;sx<samples;sx++){
          const x=Math.max(0,Math.min(mw-1,Math.floor(ix0+(ix1-ix0)*(sx+0.5)/samples)));
          const alpha=a[(y*mw+x)*4+3];
          const visible=(invertSel.value==='outside') ? alpha<128 : alpha>=128;
          if(visible) allowed++;
          total++;
        }
      }
      return total>0 && (allowed/total)>=0.06;
    }

    function otsuThreshold(hist,total){ let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i]; let sumB=0,wB=0,maxVar=0,thr=128; for(let t=0;t<256;t++){ wB+=hist[t]; if(wB===0) continue; const wF=total-wB; if(wF===0) break; sumB+=t*hist[t]; const mB=sumB/wB, mF=(sum-sumB)/wF; const between=wB*wF*(mB-mF)*(mB-mF); if(between>maxVar){ maxVar=between; thr=t; } } return thr; }

        img2.src=url;

    let imgEl=null, lastMask=null, lastBorder=null, guideData=null;
    let imgSerial=0;
    let __maskCache=null;
    let __tileCache={key:'', canvas:null};
    let __baseCanvas=null, __baseCtx=null, __guideCacheKey='';

    function resetPerfCaches(which){

    function makeMaskCacheKey(){
      return [

        imgEl ? imgEl.height : 0,
        canvas.width, canvas.height,
        imgScaleEl.value, blurEl.value, edgeThrEl.value, dilateEl.value,
        borderWidthEl.value, methodEl.value, thrFixedEl.value, invertSel.value

    function squareDilateBinary(src,w,h,R){
      if(R<=0) return new Uint8ClampedArray(src);
      const tmp=new Uint8ClampedArray(w*h);
      const out=new Uint8ClampedArray(w*h);
      for(let y=0;y<h;y++){
        const row=y*w;
        let count=0;
        const xEnd=Math.min(w-1,R);
        for(let xx=0;xx<=xEnd;xx++){ if(src[row+xx]) count++; }
        for(let x=0;x<w;x++){
          tmp[row+x]=count>0?255:0;
          const left=x-R;
          const right=x+R+1;
          if(left>=0 && src[row+left]) count--;
          if(right<w && src[row+right]) count++;
        }
      }
      for(let x=0;x<w;x++){
        let count=0;
        const yEnd=Math.min(h-1,R);
        for(let yy=0;yy<=yEnd;yy++){ if(tmp[yy*w+x]) count++; }
        for(let y=0;y<h;y++){
          out[y*w+x]=count>0?255:0;
          const top=y-R;
          const bottom=y+R+1;
          if(top>=0 && tmp[top*w+x]) count--;
          if(bottom<h && tmp[bottom*w+x]) count++;

      }
      return out;
    }

    function insideByThreshold(g, thr){ return (invertSel.value === 'inside') ? (g > thr) : !(g > thr); }

    function buildMask(){
      const w=canvas.width,h=canvas.height;
      const key=makeMaskCacheKey();
      if(__maskCache && __maskCache.key===key){
        lastMask=__maskCache.mask;
        lastBorder=__maskCache.border;
        return __maskCache;
      }

      const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h; const t=tmp.getContext('2d',{willReadFrequently:true});

    function makeMandalaTile(size){

      const stroke=parseFloat(strokeEl.value);
      const style=styleEl.value;
      const t=document.createElement('canvas'); t.width=t.height=size; const x=t.getContext('2d');
      x.translate(size/2,size/2);
      x.strokeStyle='#000';
      x.lineWidth=Math.max(0.5,size*0.004*stroke);

    function makePDFfromRGB(rgbBytes,w,h){
      const te = new TextEncoder();
      const chunks = []; let size = 0; const offsets=[0];
      const add=(s)=>{ const b=te.encode(s); chunks.push(b); size+=b.length; };
      const addBin=(b)=>{ chunks.push(b); size+=b.length; };
      const mark=()=>{ offsets.push(size); };
      add('%PDF-1.4\n');
      mark(); add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
      mark(); add('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
      mark(); add(`3 0 obj
<< /Type /Page /Parent 2 0 R
/MediaBox [0 0 ${w} ${h}]
/Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 4 0 R >> >>
/Contents 5 0 R >>
endobj
`);
      mark(); add(`4 0 obj
<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Length ${rgbBytes.length} >>
stream
`);
      addBin(rgbBytes);
      add('\nendstream\nendobj\n');
      const content = `q
${w} 0 0 ${h} 0 0 cm
/Im0 Do
Q
`;
      mark(); add(`5 0 obj
<< /Length ${content.length} >>
stream
${content}endstream
endobj
`);
      const startxref=size;
      add('xref\n0 6\n');
      add('0000000000 65535 f \n');
      for(let i=1;i<=5;i++){ const off=String(offsets[i]).padStart(10,'0'); add(off+' 00000 n \n'); }

<< /Size 6 /Root 1 0 R >>
startxref
${startxref}
%%EOF`);
      return new Blob(chunks,{type:'application/pdf'});
    }

    function makeTIFFfromCanvas(can){

    }

    if(colorPicker){ colorPicker.addEventListener('input', e => { setCurrentColorHex(e.target.value); }); }
    if(colorHex){
      colorHex.addEventListener('change', e => {
        let v = (e.target.value||'').trim();
        if(!v) return;
        if(!v.startsWith('#')) v = '#'+v;
        if(/^#[0-9a-fA-F]{6}$/.test(v)){ setCurrentColorHex(v); }
        else { e.target.value = (currentColor||'#ff9900').toUpperCase(); }
      });
    }

    
    const customBtn = document.getElementById('customBtn');
    const customOverlay = document.getElementById('customOverlay');
    const customCanvas = document.getElementById('customCanvas');
    const customBrush = document.getElementById('customBrush');
    const customBrushVal = document.getElementById('customBrushVal');
    const customColor = document.getElementById('customColor');
    const customUse = document.getElementById('customUse');
    const customClear = document.getElementById('customClear');
    const customClose = document.getElementById('customClose');

    window.__useCustomTile = false;
    window.__customTile = null;
    window.__customTileVersion = 0;
    
    const customReps = document.getElementById('customReps');
    const customRepsVal = document.getElementById('customRepsVal');
    const customMirror = document.getElementById('customMirror');
    const customBg = document.getElementById('customBg');

    window.__customBgColor = (customBg && customBg.value) ? customBg.value : '#ffffff';

    function syncRepsLabel(){
      if(customRepsVal && customReps) customRepsVal.textContent = customReps.value;
    }
    if(customReps){
      customReps.addEventListener('input', syncRepsLabel);
      syncRepsLabel();
    }
    if(customBg){
      customBg.addEventListener('input', function(){
        window.__customBgColor = this.value;
        if(customCanvas){
          customCanvas.style.background = window.__customBgColor;
        }
      });
      
      if(customCanvas){ customCanvas.style.background = window.__customBgColor; }
    }

    function drawSegment(p1, p2){
      if(!ccx) return;
      ccx.save();
      ccx.lineCap='round'; ccx.lineJoin='round';
      ccx.strokeStyle = (customColor && customColor.value) ? customColor.value : '#000';
      ccx.lineWidth = parseInt((customBrush && customBrush.value) || 12, 10);

      const n = Math.max(1, parseInt((customReps && customReps.value) || '1', 10));
      const mirror = !!(customMirror && customMirror.checked);
      const cx = cc.width/2, cy = cc.height/2;

      function transform(pt, angle, doMirror){
        let x = pt.x - cx;
        let y = pt.y - cy;
        if(doMirror){ x = -x; }
        const c = Math.cos(angle), s = Math.sin(angle);
        const xr = x*c - y*s;
        const yr = x*s + y*c;
        return { x: xr + cx, y: yr + cy };
      }

      for(let k=0; k<n; k++){
        const a = (Math.PI*2*k)/n;
        
        let A = transform(p1, a, false);
        let B = transform(p2, a, false);
        ccx.beginPath(); ccx.moveTo(A.x, A.y); ccx.lineTo(B.x, B.y); ccx.stroke();
        
        if(mirror){
          A = transform(p1, a, true);
          B = transform(p2, a, true);
          ccx.beginPath(); ccx.moveTo(A.x, A.y); ccx.lineTo(B.x, B.y); ccx.stroke();
        }
      }
      ccx.restore();
    }


    function openCustom(){ customOverlay && customOverlay.classList.add('show'); }
    function closeCustom(){ customOverlay && customOverlay.classList.remove('show'); }

    if(customBtn){
      customBtn.addEventListener('click', function(){
        
        if(customOverlay && customOverlay.classList.contains('show')) closeCustom();
        else openCustom();
      });
    }

    if(customBrush && customBrushVal){
      customBrush.addEventListener('input', function(){ customBrushVal.textContent = this.value + ' px'; });
    }

    
    let cc=null, ccx=null, drawingC=false, lastPt=null;
    function ensureCC(){
      if(cc) return;
      if(!customCanvas) return;
      cc = customCanvas;
      ccx = cc.getContext('2d');
      ccx.clearRect(0,0,cc.width,cc.height);
    }
    function getCPoint(e){
      const r = cc.getBoundingClientRect();
      const x = (e.clientX - r.left) * (cc.width / r.width);
      const y = (e.clientY - r.top) * (cc.height / r.height);
      return {x, y};
    }
    function strokeTo(pt){
      if(!ccx || !lastPt) return;
      drawSegment(lastPt, pt);
    }
    if(customCanvas){
      customCanvas.addEventListener('pointerdown', function(e){
        e.preventDefault();
        ensureCC();
        drawingC=true; lastPt=getCPoint(e);
        customCanvas.setPointerCapture && customCanvas.setPointerCapture(e.pointerId);
      });
      customCanvas.addEventListener('pointermove', function(e){
        if(!drawingC) return;
        const pt = getCPoint(e);
        strokeTo(pt); lastPt = pt;
      });
      function endC(){ drawingC=false; lastPt=null; }
      customCanvas.addEventListener('pointerup', endC);
      customCanvas.addEventListener('pointercancel', endC);
      customCanvas.addEventListener('lostpointercapture', endC);
    }

    if(customClear){
      customClear.addEventListener('click', function(){
        ensureCC();
        if(ccx){ ccx.clearRect(0,0,cc.width,cc.height); }
        if(customCanvas){ customCanvas.style.background = window.__customBgColor || '#ffffff'; }
      });
    }

    if(customUse){
      customUse.addEventListener('click', function(){
        ensureCC();
        
        var t=document.createElement('canvas'); t.width=cc.width; t.height=cc.height; var tx=t.getContext('2d');
        
        if(window.__customBgColor){ tx.fillStyle = window.__customBgColor; tx.fillRect(0,0,t.width,t.height); }
        tx.drawImage(cc,0,0);
        window.__customTile = t;
        window.__customTileVersion = (window.__customTileVersion||0) + 1;
        resetPerfCaches('tile');
        window.__useCustomTile = true;
        customBtn && customBtn.setAttribute('aria-pressed','true');
        closeCustom();
        scheduleRender();
      });
    }
    if(customClose){
      customClose.addEventListener('click', function(){ closeCustom(); });
    }

    
    if(customBtn){
      let pressTimer=null;
      customBtn.addEventListener('mousedown', function(){
        pressTimer = setTimeout(function(){
          window.__useCustomTile = !window.__useCustomTile;
          resetPerfCaches('tile');
          customBtn.setAttribute('aria-pressed', window.__useCustomTile?'true':'false');
          scheduleRender();
        }, 550);
      });
      ['mouseup','mouseleave'].forEach(ev => customBtn.addEventListener(ev, function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }));
    }

    
    const _resetAll = resetAll;
    resetAll = function(){
      _resetAll();
      window.__useCustomTile=false;
      window.__customTile=null;
      window.__customTileVersion=(window.__customTileVersion||0)+1;
      resetPerfCaches('tile');
      if(customBtn) customBtn.setAttribute('aria-pressed','false');
      if(customOverlay) customOverlay.classList.remove('show');
      if(ccx && cc){ ccx.clearRect(0,0,cc.width,cc.height); }
    };


    function resetAll(){
   
      mosaicVisible = true;
      setPanMode(false);
      draggingPan = false; panStart = null;
      tileOffsetX = 0; tileOffsetY = 0;

      paintOn = false; paintOverlay.classList.remove('show'); paintToggle.setAttribute('aria-pressed','false');
      paintLayer = null; pctx = null; currentColor='#ff9900'; erase=false; tool='bucket'; drawing=false;
      bucketBtn.setAttribute('aria-pressed','true'); brushBtn.setAttribute('aria-pressed','false'); eraserBtn.setAttribute('aria-pressed','false');
      document.querySelector('#paintOverlay .palette').style.display='flex';


      lastMask=null; lastBorder=null; guideData=null; resetPerfCaches('all');

      imgScaleEl.value=100; imgScaleVal.textContent='100%';
      tileEl.value=180; tileVal.textContent='180 px';
      borderWidthEl.value=6; borderWidthVal.textContent='6 px';
      strokeEl.value=1.8; strokeVal.textContent='1.8';
      dilateEl.value=6; dilateVal.textContent='6 px';
      blurEl.value=2; blurVal.textContent='2 px';
      edgeThrEl.value=35; edgeThrVal.textContent='35';
      thrFixedEl.value=200; thrFixedVal.textContent='200';
      ringsEl.value=10; ringsVal.textContent='10';
      spokesEl.value=20; spokesVal.textContent='20';
      styleEl.value='ellipse';
      methodEl.value='auto';
      invertSel.value='inside';
      exportScaleEl.value='1';
      formatEl.value='png';
      bgMode.value='transparent';
      applyBgModeVisual();

      mosaicToggle.setAttribute('aria-pressed','true');
      mosaicToggle.title = I18N[currentLang]['mosaicTitleOn'];
      panToggle.setAttribute('aria-pressed','false');
      waveBtn.setAttribute('aria-pressed','false'); creditsOn=false; creditsOverlay.classList.remove('show'); creditsOverlay.innerHTML='';

      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width,canvas.height);

      render();
    }

    fileBtn.addEventListener('click',function(){ fileInput.click(); });
    fileInput.addEventListener('change',function(){
      const f=fileInput.files&&fileInput.files[0];
      if(imgEl && typeof imgEl.close==='function'){ try{ imgEl.close(); }catch(_){ } }
      imgEl=null; imgSerial++; resetPerfCaches('all');
      resetAll(); 
      fileName.textContent=f ? f.name : I18N[currentLang].none;
      if(f) (async()=>{ try{ infoDiv.textContent=(currentLang==='es'?'Procesando imagen…':'Processing image…'); imgEl=await loadBitmap(f); imgSerial++; resetPerfCaches('all'); render(); infoDiv.textContent=''; }catch(e){ showErr((currentLang==='es'?'No se pudo cargar la imagen':'Could not load image'),e); } })();
    });

    
    $('langEs').addEventListener('click', function(){ setLang('es'); });
    $('langEn').addEventListener('click', function(){ setLang('en'); });

    let __maskInputTimer=0;
    function scheduleMaskRender(){
      clearTimeout(__maskInputTimer);
      // A short debounce prevents several 1.44M-pixel mask rebuilds while a
      // finger is moving a slider. Labels remain instantaneous.
      __maskInputTimer=setTimeout(function(){ __maskInputTimer=0; scheduleRender(); }, 55);
    }
    function syncControlLabels(){
      if(blurVal) blurVal.textContent=blurEl.value+' px';
      if(edgeThrVal) edgeThrVal.textContent=edgeThrEl.value;
      if(dilateVal) dilateVal.textContent=dilateEl.value+' px';
      if(borderWidthVal) borderWidthVal.textContent=borderWidthEl.value+' px';
      if(thrFixedVal) thrFixedVal.textContent=thrFixedEl.value;
      if(imgScaleVal) imgScaleVal.textContent=imgScaleEl.value+'%';
      if(tileVal) tileVal.textContent=tileEl.value+' px';
      if(strokeVal) strokeVal.textContent=parseFloat(strokeEl.value).toFixed(1);
      if(spokesVal) spokesVal.textContent=spokesEl.value;
      if(ringsVal) ringsVal.textContent=ringsEl.value;
    }

    [blurEl,edgeThrEl,dilateEl,borderWidthEl,methodEl,thrFixedEl,invertSel,imgScaleEl]
      .forEach(function(el){
        el.addEventListener('input',function(){ syncControlLabels(); scheduleMaskRender(); });
        el.addEventListener('change',function(){ clearTimeout(__maskInputTimer); __maskInputTimer=0; scheduleRender(); });
      });

    [tileEl,strokeEl,spokesEl,ringsEl,styleEl]
      .forEach(function(el){ el.addEventListener('input',function(){ syncControlLabels(); scheduleRender(); }); });

    bgMode.addEventListener('input', applyBgModeVisual);

    function showErr(msg,e){ console.error(msg,e||''); infoDiv.textContent='⚠️ '+msg+(e?(' — '+(e.message||e)):''); }

    function applyInitial(){
      setLang('en'); 
      render();
    }

    applyInitial();
  
    const lanternBtn = document.getElementById('lanternToggle');
    let __rafPending = false;
    function scheduleRender(){
      if(__rafPending) return;
      __rafPending = true;
      requestAnimationFrame(function(){ __rafPending=false; try{ render(); }catch(e){ console.error(e); } });
    }

    if(lanternBtn){
      lanternBtn.addEventListener('click', function(){
        lanternOn = !lanternOn;
        lanternBtn.setAttribute('aria-pressed', lanternOn ? 'true' : 'false');
        scheduleRender();
      });
    }

    (function(){
      let draggingShift = false;
      let start = null;
      const stage = document.getElementById('c');
      if(!stage) return;
      stage.addEventListener('pointerdown', function(e){
        if(!e.shiftKey) return;
        e.preventDefault();
        draggingShift = true;
        const r=stage.getBoundingClientRect();
        const sx=(e.clientX-r.left)*(stage.width/r.width), sy=(e.clientY-r.top)*(stage.height/r.height);
        start = { x:sx, y:sy, ox:tileOffsetX, oy:tileOffsetY };
        stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', function(e){
        if(!draggingShift) return;
        const r=stage.getBoundingClientRect();
        const sx=(e.clientX-r.left)*(stage.width/r.width), sy=(e.clientY-r.top)*(stage.height/r.height);
        const dx=sx-start.x, dy=sy-start.y;
        if(setPanOffsets(start.ox+dx,start.oy+dy)) scheduleRender();
      });
      function stop(){ draggingShift=false; start=null; }
      stage.addEventListener('pointerup', stop);
      stage.addEventListener('pointercancel', stop);
      stage.addEventListener('lostpointercapture', stop);
    })();

    (function(){
      const __orig = (typeof fillPatternWithOffset==='function') ? fillPatternWithOffset : null;
      if(!__orig) return;
      fillPatternWithOffset = function(ctxTarget, pat, W, H, tileSize){
        if(!pat){ return; }
        if(lanternOn){
          try{
            let tileCanvas = (typeof getCurrentTileCanvas==='function') ? getCurrentTileCanvas(tileSize) : ((typeof makeMandalaTile === 'function') ? makeMandalaTile(tileSize) : null);
            // Single-motif mode uses an absolute offset: no modulo wrap/jump.
            const cx = Math.round(W/2 - tileSize/2 + tileOffsetX);
            const cy = Math.round(H/2 - tileSize/2 + tileOffsetY);
            ctxTarget.save();
            ctxTarget.imageSmoothingEnabled = true;
            ctxTarget.imageSmoothingQuality = 'high';
            if(tileCanvas && tileCanvas.width){
              ctxTarget.drawImage(tileCanvas, cx, cy);
            } else {
              if(pat.setTransform){
                const m = new DOMMatrix(); m.translateSelf(cx, cy); pat.setTransform(m);
              } else { ctxTarget.translate(cx, cy); }
              ctxTarget.fillStyle = pat;
              ctxTarget.fillRect(0,0,tileSize,tileSize);
            }
            ctxTarget.restore();
          }catch(err){
            console.error('🏮 draw error, fallback', err);
            return __orig(ctxTarget, pat, W, H, tileSize);
          }
        } else {
          return __orig(ctxTarget, pat, W, H, tileSize);
        }
      };
    })();

    (function(){
      floodFill = function(x,y){
        if(!guideData){ render(); if(!guideData) return; }
        ensurePaint();
        const w=canvas.width,h=canvas.height;
        const g=guideData.data;
        const painted=pctx.getImageData(0,0,w,h); const pd=painted.data;
        const idx=(xx,yy)=>(yy*w+xx)*4;
        let s=idx(x,y);

        // A barrier is either a dark guide line or an already-painted dark pixel.
        // Reading the paint layer we already need avoids a second 5.8 MB readback
        // from the visible canvas on every bucket fill.
        function isBar(i){
          if(g && g[i+3]>7){
            const y0 = 0.299*g[i] + 0.587*g[i+1] + 0.114*g[i+2];
            if(y0 < 140) return true;
          }
          if(pd[i+3]>7){
            const y1 = 0.299*pd[i] + 0.587*pd[i+1] + 0.114*pd[i+2];
            if(y1 < 150) return true;
          }
          return false;
        }
        if(isBar(s)){
          let found=false;
          for(let r=1; r<=2 && !found; r++){
            for(let dy=-r; dy<=r && !found; dy++){
              for(let dx=-r; dx<=r && !found; dx++){
                const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=w||ny>=h) continue;
                const ni=idx(nx,ny);
                if(!isBar(ni)){ x=nx; y=ny; s=ni; found=true; }
              }
            }
          }
          if(!found) return;
        }

        const rgb=hexToRGB(currentColor);
        const seen=new Uint8Array(w*h);
        const q=[y*w+x];
        function cond(xx,yy){
          if(xx<0||yy<0||xx>=w||yy>=h) return false;
          const p=yy*w+xx;
          return !seen[p] && !isBar(p*4);
        }
        while(q.length){
          const seed=q.pop();
          let xi=seed%w; const py=(seed/w)|0;
          while(xi>=0 && cond(xi,py)) xi--; xi++;
          let up=false,down=false;
          while(xi<w && cond(xi,py)){
            const pi=py*w+xi, di=pi*4; seen[pi]=1;
            if(erase){ pd[di]=pd[di+1]=pd[di+2]=0; pd[di+3]=0; }
            else { pd[di]=rgb[0]; pd[di+1]=rgb[1]; pd[di+2]=rgb[2]; pd[di+3]=255; }
            if(py>0){
              if(cond(xi,py-1) && !up){ q.push((py-1)*w+xi); up=true; }
              else if(!cond(xi,py-1)){ up=false; }
            }
            if(py<h-1){
              if(cond(xi,py+1) && !down){ q.push((py+1)*w+xi); down=true; }
              else if(!cond(xi,py+1)){ down=false; }
            }
            xi++;
          }
        }
        pctx.putImageData(painted,0,0);
        scheduleRender();
      };
    })();

    (function(){
      const btn=document.getElementById('download');
      if(!btn) return;
      btn.addEventListener('click', function(){
        requestAnimationFrame(function(){
          try{ render(); }catch(_){}
        });
      }, {passive:true});
    })();
    
})();
  </script>
